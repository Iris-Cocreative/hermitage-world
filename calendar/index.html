<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar · Hermitage World</title>
<meta name="description" content="Every Hermitage gathering, program and retreat, by month or as a list, in your own time zone.">
<meta name="theme-color" content="#1f1405">
<link rel="icon" href="../assets/img/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Alegreya:ital@0;1&display=swap">
<link rel="stylesheet" href="../assets/css/main.css">
<script src="../assets/js/site.js"></script>
</head>
<body>
<hw-header></hw-header>

<main id="main">

<section class="page-hero" data-room="dark">
  <div class="room-arch" aria-hidden="true"></div>
  <div class="container page-hero__inner">
    <div data-reveal>
      <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../gatherings/">Gatherings</a><span aria-hidden="true">/</span><span>Calendar</span></nav>
      <h1>Calendar</h1>
      <p class="t-lede">Gatherings, programs and retreats in your own time zone (<span data-viewer-tz>your time zone</span>). <span class="draft-mark">times are placeholders until the schedule is confirmed</span></p>
    </div>
  </div>
</section>

<section class="section section--flush-top month" data-room="dark">
  <div class="container" data-gatherings="month"></div>
</section>

<section class="section section--seam" data-room="deep">
  <div class="container">
    <div class="section-head">
      <h2 data-reveal>The next four weeks</h2>
      <fieldset class="chips" data-gatherings-filter="#upcoming" aria-label="Show">
        <label class="chip"><input type="radio" name="c-filter" value="all" checked><span>Everything</span></label>
        <label class="chip"><input type="radio" name="c-filter" value="online"><span>Online</span></label>
        <label class="chip"><input type="radio" name="c-filter" value="in-person"><span>In person</span></label>
      </fieldset>
    </div>
    <div id="upcoming" data-gatherings="upcoming" data-weeks="4" aria-live="polite"></div>
  </div>
</section>

</main>

<hw-signup></hw-signup>
<hw-footer></hw-footer>
<script src="../assets/data/gatherings.js"></script>
</body>
</html>
