<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hermitage World — hero test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Alegreya:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/temple.css">
<style>
  html,body{margin:0;background:#1f1405;color:#f1ebdf}
  body{font-family:"Alegreya Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .filler{height:200vh;background:#1f1405;padding:12vh 7.75vw 0;box-sizing:border-box}
  .filler h2{font-family:Marcellus,serif;font-weight:400;font-size:clamp(2rem,4vw,3.5rem);margin:0 0 1rem}
  .filler p{max-width:34rem;font-size:1.125rem;line-height:1.6;color:rgba(241,235,223,.7)}
</style>
</head>
<body>

<section class="hero" id="hero">
  <div class="hero__stage">
    <canvas class="hero__gl" id="hero-gl" aria-hidden="true"></canvas>
    <div class="hero__scrim" aria-hidden="true"></div>
    <div class="hero__copy">
      <h1 class="hero__title">Hermitage<br>World</h1>
    </div>
    <div class="hero__cue" aria-hidden="true"><span></span></div>
  </div>
</section>

<section class="filler">
  <h2>After the threshold</h2>
  <p>Dark filler section so the hand-off from the hero into the page ground can be checked while scrolling past.</p>
</section>

<script type="module" src="assets/temple.js"></script>
</body>
</html>
